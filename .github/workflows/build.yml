name: Build Frontend and Backend

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          repository: autcharle/capstone-kimai
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22" # Set the Node.js version to use for the build
      - name: Navigate to frontend subdirectory
        run: |
          cd Nhom_01/02_Source/frontend/kimai
          # Now you can run commands inside the 'kimai' subdirectory
          ls -la  # List the files in the subdirectory (optional)
          npm install
          npm run build

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          repository: autcharle/capstone-kimai
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22" # Set the Node.js version to use for the build
      - name: Navigate to backend subdirectory
        run: |
          cd Nhom_01/02_Source/backend/timesheet-management
          yarn install
          yarn build
